name: Build (Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Aseprite version to build (e.g. v1.3.18.1). Leave empty for the latest release."
        required: false
        type: string

# Aseprite's EULA forbids redistributing binaries. This workflow is manual only
# and must never publish a Release, a Package, or anything outside of a
# short-lived build artifact.
permissions:
  contents: read

concurrency:
  group: build-windows
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve version
        id: resolve
        uses: ./.github/actions/resolve-version
        with:
          version: ${{ inputs.version }}

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build
        shell: cmd
        run: call build.cmd
        env:
          ASEPRITE_VERSION: ${{ steps.resolve.outputs.version }}

      - name: Upload portable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aseprite-${{ steps.resolve.outputs.version }}-windows-x64
          path: dist/aseprite-*-windows-x64
          if-no-files-found: error
          retention-days: 7

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aseprite-${{ steps.resolve.outputs.version }}-windows-x64-setup
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
